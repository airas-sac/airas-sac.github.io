<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="{{ page.description | default: site.description | default: 'AI-enabled Resilience for Autonomous Systems (AIRAS) - A technical track at the 42nd ACM Symposium on Applied Computing (SAC 2027).' }}">
    <title>{{ page.title | default: site.title | default: 'AIRAS' }}</title>

    <link rel="icon" type="image/png" href="{{ '/images/acm.png' | relative_url }}">

    <!-- Fonts: Source Serif 4 for headings, Source Sans 3 for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Source+Sans+3:wght@400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Event",
      "name": "AIRAS - AI-enabled Resilience for Autonomous Systems Track at SAC 2027",
      "description": "A technical track at the 42nd ACM Symposium on Applied Computing focusing on AI-driven resilience for autonomous systems.",
      "url": "https://www.sigapp.org/sac/sac2027/"
    }
    </script>
</head>

<body>

    <!-- Navigation -->
    <nav id="top-nav">
        <div class="nav-inner">
            <a href="https://www.sigapp.org/sac/sac2027/" target="_blank" rel="noopener noreferrer"
                class="nav-cta">SAC 2027 &#8599;</a>

            <ul class="nav-links" id="navLinks">
                <li><a href="#topics">Topics</a></li>
                <li><a href="#submission">Submission</a></li>
                <li><a href="#dates">Important Dates</a></li>
                <li><a href="#committee">Contact</a></li>
            </ul>

            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- Page -->
    <div class="page-wrapper">
        {{ content }}
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-inner">
            <p>&copy; 2027 AIRAS Organizers. All rights reserved.</p>
            <a href="https://www.sigapp.org/sac/sac2027/" target="_blank" rel="noopener noreferrer">SAC 2027 &#8599;</a>
        </div>
    </footer>

    <script src="{{ '/script.js' | relative_url }}"></script>
</body>

</html>
